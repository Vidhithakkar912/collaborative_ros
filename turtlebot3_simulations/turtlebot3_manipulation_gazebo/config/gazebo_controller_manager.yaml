/manipulator/controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 1000  

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

/manipulator/joint_state_broadcaster:
  ros__parameters:
    joints:
      - manipulator/wheel_left_joint
      - manipulator/wheel_right_joint
      - manipulator/joint1
      - manipulator/joint2
      - manipulator/joint3
      - manipulator/joint4
      - manipulator/gripper_left_joint
    interfaces:
      - position
      - velocity
      # - manipulator/gripper_right_joint
    #   - manipulator/gripper_right_joint_mimic
    # map_interface_to_joint_state:
    #   manipulator/gripper_right_joint_mimic/position: manipulator/gripper_right_joint/position
    #   manipulator/gripper_right_joint_mimic/velocity: manipulator/gripper_right_joint/velocity

imu_broadcaster:
  ros__parameters:
    use_sim_time: True
    frame_id: manipulator/imu_link
    sensor_name: imu

/manipulator/arm_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - manipulator/joint1
      - manipulator/joint2
      - manipulator/joint3
      - manipulator/joint4
    interface_name: position

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 200.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

/manipulator/gripper_controller:
  ros__parameters:
    use_sim_time: True
    joint: manipulator/gripper_left_joint