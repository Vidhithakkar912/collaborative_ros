TB3_2/planner_server:
  ros__parameters:
    bond_disable_heartbeat_timeout: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      smoother:
        smoother:
          w_smooth: 0.3
          w_data: 0.2
          tolerance: 1.0e-10
          max_its: 1000
      motion_model_for_search: "MOORE"
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: false
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.2
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      debug_visualizations: false
      use_sim_time: True
    
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

TB3_2/behavior_server:
  ros__parameters:
    bond_disable_heartbeat_timeout: true
    backup:
      acceleration_limit: 1.0
      deceleration_limit: -2.0
      minimum_speed: 0.05
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    local_costmap_topic: /TB3_2/local_costmap/costmap_raw
    local_footprint_topic: /TB3_2/local_costmap/published_footprint
    global_costmap_topic: /TB3_2/global_costmap/costmap_raw
    global_footprint_topic: /TB3_2/global_costmap/published_footprint
    cycle_frequency: 10.0
    drive_on_heading:
      acceleration_limit: 1.0
      deceleration_limit: -2.0
      minimum_speed: 0.05
      plugin: nav2_behaviors/DriveOnHeading
    footprint_topic: /TB3_2/local_costmap/published_footprint
    local_frame: TB3_2/odom
    global_frame: map
    max_rotational_vel: 0.6
    min_rotational_vel: 0.15
    robot_base_frame: TB3_2/base_link
    rotational_acc_lim: 1.0
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors/Spin
    transform_tolerance: 0.1
    use_sim_time: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
