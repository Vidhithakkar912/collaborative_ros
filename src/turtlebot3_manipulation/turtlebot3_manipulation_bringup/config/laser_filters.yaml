laser_filters:
  ros__parameters:
    diagnostic_updater:
      period: 0.0
    filter1:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 4.0
        max_range_difference: 0.3
        filter_window: 3
    filter2:
      name: median_spatial
      type: laser_filters/LaserScanMedianSpatialFilter
      params:
        window_size: 3
