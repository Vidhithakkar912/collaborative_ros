ydlidar_ros2_driver_node:
  ros__parameters:
    #    port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    port: /dev/ttyUSB0
    frame_id: "base_scan"
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 7
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: False
    inverted: False
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    support_motor_dtr: true
    angle_max: 360.0
    angle_min: -360.0
    range_max: 8.0
    range_min: 0.1
    frequency: 10.0
    invalid_range_is_inf: false

